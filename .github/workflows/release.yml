name: release

# Build native installers for all three platforms and attach them to
# a GitHub Release whenever a `v*` tag is pushed.
#
# Outputs (attached to the release as downloadable assets):
#   - PunishmentManager-Setup-X.Y.Z.exe    (Windows)
#   - PunishmentManager-X.Y.Z.dmg          (macOS)
#   - punishment-manager_X.Y.Z_amd64.deb   (Linux)
#   - Source code archives                 (auto-generated by GitHub)
#
# To cut a release:
#   ./scripts/make_release.sh 1.0.0
#   (or just: git tag v1.0.0 && git push origin v1.0.0)
#
# Then visit:
#   https://github.com/mob5824m-wq/Punishment-Manager/releases/tag/v1.0.0

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required to create the release + upload assets

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux (.deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install build dependencies
        run: bash $GITHUB_WORKSPACE/.github/scripts/install-linux-deps.sh
      - name: Install Python dependencies
        run: bash -c "python -m pip install --upgrade pip && pip install -r requirements.txt && pip install pyinstaller"
      - name: Smoke-test imports
        run: |
          python -c "import bot, installer; print('imports OK')"
      - name: Build .deb
        run: build/build_linux.sh
      - name: Verify .deb
        run: |
          ls -lh dist/
          dpkg-deb -I dist/*.deb
      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: punishment-manager-linux
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 7
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: dist/*.deb

  macos:
    name: macos (.dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Install create-dmg
        run: brew install create-dmg
      - name: Build .dmg
        run: build/build_macos.sh
      - name: Verify .dmg
        run: |
          ls -lh dist/
          hdiutil verify dist/*.dmg || true
      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: punishment-manager-macos
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 7
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: dist/*.dmg

  windows:
    name: windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Install NSIS
        run: pwsh -File .github/scripts/install-nsis.ps1
      - name: Build .exe
        run: build\build_windows.bat
        shell: cmd
      - name: Verify .exe
        run: dir dist\*.exe
      - name: Upload .exe
        uses: actions/upload-artifact@v4
        with:
          name: punishment-manager-windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 7
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: dist/*.exe
