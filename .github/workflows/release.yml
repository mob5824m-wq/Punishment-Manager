name: release

# Build native installers for all three platforms and attach them to
# a GitHub Release whenever a `v*` tag is pushed.
#
# Outputs (attached to the release as downloadable assets):
#   - PunishmentManager-Setup-X.Y.Z.exe    (Windows)
#   - PunishmentManager-X.Y.Z.dmg          (macOS)
#   - punishment-manager_X.Y.Z_amd64.deb   (Linux)
#   - Source code archives                 (auto-generated by GitHub)
#
# Merges to main are handled by merge-release.yml instead: it publishes the
# rolling `latest-build` prerelease plus a `v<VERSION>-build.<run>`
# prerelease. Those generated tags are skipped here (see the `if:` guards), so
# only a tag a maintainer pushed can produce a curated release.
#
# To cut a release:
#   ./scripts/make_release.sh 1.0.0
#   (or just: git tag v1.0.0 && git push origin v1.0.0)
#
# Then visit:
#   https://github.com/mob5824m-wq/Sentinel/releases/tag/v1.0.0

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required to create the release + upload assets

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # `v2.5.0-build.42` and friends belong to merge-release.yml, which already
    # published them; rebuilding here would create a second, empty release.
    if: ${{ !contains(github.ref_name, '-build.') }}
    uses: ./.github/workflows/build-installers.yml

  publish:
    name: attach the installers to the release
    needs: build
    if: ${{ !contains(github.ref_name, '-build.') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Needed for the publish script below (and its VERSION file), not for
      # the build - the installers arrive as artifacts.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Show what was built
        run: ls -lh artifacts/
      - name: Attach the installers to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-tag-release.sh artifacts
