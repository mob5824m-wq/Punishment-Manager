name: build

# Sanity-check the installers on every pull request into main and on every
# push to a feature branch, so a build-script regression fails before it can
# be merged.
#
# Pushes to main are deliberately not listed here: a merge to main is built
# once, by merge-release.yml, which calls the same reusable workflow
# (build-installers.yml) and publishes the result as a release. Listing main
# here too would build all six installers twice for every merge.

on:
  push:
    branches: ['arena/**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installers:
    uses: ./.github/workflows/build-installers.yml
