name: build-installers

# Reusable workflow: builds the three native installers (.deb, .dmg, .exe) and
# uploads each one as a workflow artifact. It holds no release logic of its
# own, so the platform build steps exist in exactly one place.
#
# Called by:
#   build.yml          - sanity check on pull requests and arena/* pushes
#   release.yml        - `v*` tags: the assets are attached to the release
#   merge-release.yml  - every merge to main: the assets are published to the
#                        rolling `latest-build` release and to a per-merge
#                        prerelease
#
# The artifact names are fixed (punishment-manager-linux / -macos / -windows)
# and the files keep the names the build scripts give them, so the callers can
# find them with actions/download-artifact and glob the three extensions.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  linux:
    name: linux (.deb)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install build dependencies
        run: bash $GITHUB_WORKSPACE/.github/scripts/install-linux-deps.sh
      - name: Install Python dependencies
        run: bash -c "python -m pip install --upgrade pip && pip install -r requirements.txt && pip install pyinstaller"
      - name: Smoke-test imports
        run: |
          python -c "import bot, installer, paths; print('imports OK')"
      - name: Test runtime paths and version plumbing
        run: |
          python -m pip install -q pytest
          python -m pytest tests -q --tb=short
      - name: Build .deb
        run: build/build_linux.sh
      - name: Verify .deb
        run: |
          ls -lh dist/
          dpkg-deb -I dist/*.deb
      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: punishment-manager-linux
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 3

  macos:
    name: macos (.dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Install create-dmg
        run: brew install create-dmg
      - name: Test runtime paths and version plumbing
        run: |
          python -m pip install -q pytest
          python -m pytest tests -q --tb=short
      - name: Build .dmg
        run: build/build_macos.sh
      - name: Verify .dmg
        run: |
          ls -lh dist/
          hdiutil verify dist/*.dmg || true
      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: punishment-manager-macos
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 3

  windows:
    name: windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Test runtime paths and version plumbing
        run: |
          python -m pip install -q pytest
          python -m pytest tests -q --tb=short
      - name: Install NSIS
        run: pwsh -File .github/scripts/install-nsis.ps1
      - name: Build .exe
        run: build\build_windows.bat
        shell: cmd
      - name: Verify .exe
        run: dir dist\*.exe
      - name: Upload .exe
        uses: actions/upload-artifact@v4
        with:
          name: punishment-manager-windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 3
