name: release

# Build native installers for all three platforms and attach them to
# a GitHub Release whenever a `v*` tag is pushed.
#
# Outputs (attached to the release as downloadable assets):
#   - PunishmentManager-Setup-X.Y.Z.exe    (Windows)
#   - PunishmentManager-X.Y.Z.dmg          (macOS)
#   - punishment-manager_X.Y.Z_amd64.deb   (Linux)
#   - Source code archives                 (auto-generated by GitHub)
#
# To cut a release:
#   ./scripts/make_release.sh 1.0.0
#   (or just: git tag v1.0.0 && git push origin v1.0.0)
#
# Then visit:
#   https://github.com/mob5824m-wq/Punishment-Manager/releases/tag/v1.0.0

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required to create the release + upload assets

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't cancel the other platforms if one fails - we want to know
      # which one broke.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_path: dist/*.deb
            build_script: build/build_linux.sh
            shell: bash
          - os: macos-latest
            artifact_path: dist/*.dmg
            build_script: build/build_macos.sh
            shell: bash
          - os: windows-latest
            artifact_path: dist/*.exe
            build_script: build\build_windows.bat
            shell: cmd

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpython3.11 fakeroot dpkg lintian

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install create-dmg

      - name: Install build tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/workflows/install-nsis.ps1

      - name: Build
        run: ${{ matrix.build_script }}
        shell: ${{ matrix.shell }}

      - name: Locate built artifact
        id: locate
        run: |
          set -e
          for f in dist/*.deb dist/*.dmg dist/*.exe; do
            if [ -f "$f" ]; then
              echo "artifact=$f" >> "$GITHUB_OUTPUT"
              echo "Found artifact: $f"
              exit 0
            fi
          done
          echo "::error::No built artifact found in dist/"
          ls -la dist/
          exit 1

      - name: Upload build artifact (for inspection)
        uses: actions/upload-artifact@v4
        with:
          name: punishment-manager-${{ runner.os }}
          path: ${{ steps.locate.outputs.artifact }}
          if-no-files-found: error
          retention-days: 7

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          # `fail_on_unmatched_files: false` so all three matrix jobs
          # can run their upload step independently without failing
          # when their specific artifact is the one they're uploading
          # (vs. looking for ALL of them).
          fail_on_unmatched_files: true
          files: ${{ steps.locate.outputs.artifact }}
